---
galaxy_info:
  namespace: deekayen
  role_name: cloudwatch_monitoring_scripts
  author: David Norman
  description: "Install AWS CloudWatch Agent scripts to send metrics for monitoring memory, swap, and disk space."

  github_branch: main
  issue_tracker_url: https://github.com/deekayen/ansible-role-cloudwatch_monitoring_scripts/issues

  license: MIT
  min_ansible_version: "2.15"

  # AWS replaced these scripts with the CloudWatch agent; kept for EL 7/8.
  platforms:
    - name: EL
      versions:
        - "7"
        - "8"

  galaxy_tags:
    - amazon
    - aws
    - centos
    - redhat
    - cloudwatch

dependencies:
  - role: blackstar257.perl
    vars:
      perl_cpanm_modules:
        - Switch
        - DateTime
        - Digest::SHA

  - role: blackstar257.perl
    vars:
      perl_cpanm_modules:
        - Sys::Syslog
        - LWP::Protocol::https
    when:
      - ansible_facts.distribution == 'CentOS' or ansible_facts.distribution == 'RedHat'
      - ansible_facts.distribution_major_version == '8'
